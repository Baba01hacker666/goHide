name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            cc: gcc
            apt: gcc
          - goarch: arm64
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: build (go launcher + ptrace engine)
        env:
          CC: ${{ matrix.cc }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          dest="dist/gohide-linux-${GOARCH}"
          mkdir -p "$dest"
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$dest/gohide" .
          "$CC" -O2 -DZVERSION=\"${GITHUB_REF_NAME#v}\" \
            -o "$dest/gohide-zapper" core/zapper.c
          cp README.md LICENSE "$dest/"

      - name: smoke test (native arch only)
        if: matrix.goarch == 'amd64'
        run: |
          out="$(dist/gohide-linux-amd64/gohide /bin/sh -c 'ps -p $$ -o args=')"
          echo "$out"
          echo "$out" | grep -q '^\[kworker/'

      - name: package
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          tar -czf "gohide-linux-${GOARCH}.tar.gz" -C dist "gohide-linux-${GOARCH}"
          sha256sum "gohide-linux-${GOARCH}.tar.gz" > "gohide-linux-${GOARCH}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: gohide-linux-${{ matrix.goarch }}
          path: gohide-linux-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: rel

      - name: publish release with gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" rel/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "gohide $GITHUB_REF_NAME" \
            --generate-notes
