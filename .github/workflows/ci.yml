name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: vet
        run: go vet ./...

      - name: unit tests
        run: go test -v ./...

      - name: build
        run: make build

      - name: smoke test (cmdline masquerade)
        run: |
          out="$(./bin/gohide /bin/sh -c 'ps -p $$$$ -o args=')"
          echo "$out"
          echo "$out" | grep -q '^\[kworker/'

      - name: smoke test (background target)
        run: |
          GOHIDE_NAME='[ksoftirqd/2]' ./bin/gohide sleep 30 >/dev/null 2>&1 &
          pid=$!
          sleep 0.5
          args="$(ps -p $pid -o args=)"
          echo "args=$args"
          [ "$args" = "[ksoftirqd/2]" ]
          kill $pid

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
