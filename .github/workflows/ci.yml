name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: vet
        run: go vet ./...

      - name: unit tests
        run: go test -v ./...

      - name: build
        run: make build

      - name: smoke test (cmdline masquerade)
        run: |
          out="$(./bin/gohide /bin/sh -c 'ps -p $$ -o args=')"
          echo "$out"
          echo "$out" | grep -q '^\[kworker/'

      - name: smoke test (custom name + comm)
        run: |
          comm="$(GOHIDE_NAME='[ksoftirqd/2]' ./bin/gohide /bin/sh -c 'cat /proc/$$/comm')"
          args="$(GOHIDE_NAME='[ksoftirqd/2]' ./bin/gohide /bin/sh -c 'ps -p $$ -o args=')"
          echo "comm=$comm args=$args"
          [ "$comm" = "ksoftirqd/2" ]
          [ "$args" = "[ksoftirqd/2]" ]

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
